services:
  feedback:
    # Prebuilt tag. Build from the repo root (embeds data/feedback_taxonomy.json).
    image: gw2bo-feedback:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://feedback:${POSTGRES_PASSWORD}@db:5432/feedback
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.feedback.rule=Host(`feedback.robagentic.tech`)"
      - traefik.http.routers.feedback.entrypoints=websecure
      - traefik.http.routers.feedback.tls.certresolver=letsencrypt
      - traefik.http.services.feedback.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedback
      POSTGRES_DB: feedback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
