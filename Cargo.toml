[workspace]
members = [
    "crates/addon",
    "crates/core",
    "crates/gw2api",
    "crates/optimizer",
]
resolver = "2"

[workspace.package]
version = "1.4.10"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
thiserror = "2"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
serde_yaml = "0.9"
