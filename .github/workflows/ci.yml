name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # one group per push so a fast second push cannot cancel the first push's
  # identity check; PRs still coalesce on their ref
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit actor
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_OPENER: ${{ github.event.pull_request.user.login }}
        run: |
          admin=special-place-administrator
          if [ "$ACTOR" != "$admin" ]; then
            echo "run actor '$ACTOR' is not $admin" >&2
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$PR_OPENER" != "$admin" ]; then
            echo "pull request opener '$PR_OPENER' is not $admin" >&2
            exit 1
          fi
      - name: identity gate script
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          script=.github/scripts/check-commit-identity.sh
          if [ "$EVENT" = "pull_request" ]; then
            # run the base revision's copy: a PR must not grade itself
            git show "$BASE_SHA:$script" > "$RUNNER_TEMP/check-commit-identity.sh"
            script="$RUNNER_TEMP/check-commit-identity.sh"
          fi
          echo "IDENTITY_SCRIPT=$script" >> "$GITHUB_ENV"
      - name: commit identity selftest
        shell: bash
        run: SELFTEST=1 bash "$IDENTITY_SCRIPT"
      - name: commit identity
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ -z "$after" ] || [ "$after" = "$zero" ]; then
              after=HEAD
            fi
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              range="$after"
            elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              # force-push: before is an orphan the checkout does not have
              echo "before $before not in history; checking $after only" >&2
              range="$after"
            else
              range="${before}...${after}"
            fi
          fi
          bash "$IDENTITY_SCRIPT" "$range"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
