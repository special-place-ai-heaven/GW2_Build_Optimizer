[package]
name = "gw2-build-optimizer"
version.workspace = true
edition.workspace = true
authors = ["special-place-ai-heaven"]
description = "In-game Guild Wars 2 build optimizer and AI build assistant for Nexus"
license.workspace = true
repository = "https://github.com/special-place-ai-heaven/GW2_Build_Optimizer"

[lib]
crate-type = ["cdylib"]

[dependencies]
gw2-core = { path = "../core" }
gw2-api = { path = "../gw2api" }
gw2-optimizer = { path = "../optimizer" }
nexus = { git = "https://github.com/zerthox/nexus-rs", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
reqwest.workspace = true
uuid.workspace = true
